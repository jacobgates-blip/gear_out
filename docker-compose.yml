services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: gearout
    volumes:
      # Runs automatically the FIRST time this container's data volume is
      # created — creates the loans/monitors tables and seed data without
      # needing to run schema.sql by hand.
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - gearout_db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      # This tells phpMyAdmin to connect to the service named "db" above
      PMA_HOST: db 
      # Optional: Auto-populates the password so you don't have to type it
      MYSQL_ROOT_PASSWORD: example 
    depends_on:
      - db

volumes:
  gearout_db_data: